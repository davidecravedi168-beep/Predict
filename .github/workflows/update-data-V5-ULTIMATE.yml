name: Update Alpha Engine Data

on:
  workflow_dispatch:
  schedule:
    # Ogni 30 minuti nei feriali, fascia ampia che copre il mercato USA
    # sia con ora legale sia con ora solare.
    - cron: "*/30 12-22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: alpha-engine-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run engine with retry
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Alpha Engine attempt $attempt/3"
            if python engine.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Retry in 25 seconds..."
              sleep 25
            fi
          done
          echo "Engine failed after 3 attempts."
          exit 1

      - name: Validate generated data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          p = Path("data/latest.json")
          if not p.exists():
              raise SystemExit("data/latest.json missing")

          d = json.loads(p.read_text(encoding="utf-8"))
          if not d.get("updated_at"):
              raise SystemExit("updated_at missing")
          if "signals" not in d or "watchlist" not in d:
              raise SystemExit("signals/watchlist missing")

          ts = datetime.fromisoformat(d["updated_at"].replace("Z","+00:00"))
          age = (datetime.now(timezone.utc) - ts).total_seconds()
          if age > 600:
              raise SystemExit(f"latest.json too old: {age:.0f}s")

          print("Health check OK")
          print("updated_at:", d["updated_at"])
          print("signals:", len(d.get("signals", [])))
          print("watchlist:", len(d.get("watchlist", [])))
          PY

      - name: Save data
        shell: bash
        run: |
          set -e
          git config user.name "alpha-engine-bot"
          git config user.email "alpha-engine-bot@users.noreply.github.com"

          git add data/latest.json data/memory.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "bot: refresh Alpha Engine data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
