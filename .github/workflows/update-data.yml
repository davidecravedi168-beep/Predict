name: Update Alpha Engine Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * 1-5"
    - cron: "*/30 22-23 * * 0"

permissions:
  contents: write

concurrency:
  group: alpha-engine-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Sync before calculation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Engine governance self-test
        run: python engine.py --self-test

      - name: Run engine with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Alpha Engine attempt $attempt/3"
            if python engine.py; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Engine failed after 3 attempts."
              exit 1
            fi
            sleep 25
          done

      - name: Build observed market chart feed
        run: python scripts/build_market_series.py

      - name: Validate V8.5 snapshot and V9 chart feed
        run: python scripts/validate_v85_snapshot.py

      - name: QA pass 1
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: QA pass 2
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Write automation health receipt
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/write_automation_health.py

      - name: Save generated snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "alpha-engine-bot"
          git config user.email "alpha-engine-bot@users.noreply.github.com"

          cp data/latest.json /tmp/alpha-latest.json
          cp data/memory.json /tmp/alpha-memory.json
          cp data/automation-health.json /tmp/alpha-automation-health.json
          cp data/market-series.json /tmp/alpha-market-series.json

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/alpha-latest.json data/latest.json
            cp /tmp/alpha-memory.json data/memory.json
            cp /tmp/alpha-automation-health.json data/automation-health.json
            cp /tmp/alpha-market-series.json data/market-series.json

            git add data/latest.json data/memory.json data/automation-health.json data/market-series.json
            if git diff --cached --quiet; then
              echo "No data changes to commit."
              exit 0
            fi

            git commit -m "bot: refresh Alpha Engine data + charts"
            if git push origin HEAD:main; then
              echo "Alpha snapshot and chart feed saved successfully."
              exit 0
            fi
            sleep 5
          done

          echo "Unable to save Alpha data after 3 attempts."
          exit 1
