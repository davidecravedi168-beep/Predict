name: Update Alpha Engine Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1-5"
    - cron: "15 13 * * 1-5"
    - cron: "15 19 * * 1-5"

permissions:
  contents: write

concurrency:
  group: alpha-engine-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run engine
        run: python engine.py

      - name: Save data
        run: |
          git config user.name "alpha-engine-bot"
          git config user.email "alpha-engine-bot@users.noreply.github.com"

          git add data/latest.json data/memory.json

          if ! git diff --cached --quiet; then
            git commit -m "bot: update market data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Nessun nuovo dato da salvare"
          fi
