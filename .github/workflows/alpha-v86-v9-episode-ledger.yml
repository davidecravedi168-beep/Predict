name: Alpha v8.6 V9 Episode Ledger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_alpha_v86_external_cockpit.py'
      - 'scripts/apply_alpha_v86_upgrade_v2.py'
      - 'scripts/test_alpha_v86_external_cockpit.py'
      - '.github/workflows/alpha-v86-v9-episode-ledger.yml'

permissions:
  contents: write

concurrency:
  group: alpha-v86-v9-episode-ledger
  cancel-in-progress: false

jobs:
  migrate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded migration
        run: python scripts/apply_alpha_v86_external_cockpit.py
      - name: Python syntax
        run: python -m py_compile engine.py scripts/apply_alpha_v86_upgrade_v2.py scripts/apply_alpha_v86_external_cockpit.py scripts/test_alpha_v86_external_cockpit.py
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Episode-ledger regression tests
        run: python scripts/test_alpha_v86_external_cockpit.py
      - name: Engine self-test
        run: python engine.py --self-test
      - name: JavaScript syntax
        run: node --check finance-cockpit.js
      - name: Patch hygiene
        run: git diff --check
      - name: Commit verified source only
        run: |
          if git diff --quiet -- engine.py index.html finance-cockpit.js; then
            echo 'No verified source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine.py index.html finance-cockpit.js
          git commit -m 'Upgrade Alpha Engine to v8.6 episode ledger on V9'
          git pull --rebase origin main
          git push
