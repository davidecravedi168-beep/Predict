name: Alpha v8.6 V9 Episode Ledger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_alpha_v86_v9_upgrade.py'
      - 'scripts/test_alpha_v86_v9_guards.py'
      - '.github/workflows/alpha-v86-v9-episode-ledger.yml'

permissions:
  contents: write

jobs:
  migrate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_alpha_v86_v9_upgrade.py
      - run: python -m py_compile engine.py scripts/apply_alpha_v86_upgrade_v2.py scripts/apply_alpha_v86_v9_upgrade.py scripts/test_alpha_v86_v9_guards.py
      - run: pip install -r requirements.txt
      - run: python scripts/test_alpha_v86_v9_guards.py
      - run: python engine.py --self-test
      - run: git diff --check
      - name: Commit verified source
        run: |
          if git diff --quiet -- engine.py index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine.py index.html
          git commit -m 'Upgrade Alpha Engine to v8.6 episode ledger on V9'
          git push
