name: Alpha Engine — Model Health & Root Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Alpha Engine Data"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: alpha-model-health-sync
  cancel-in-progress: false

jobs:
  health-sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build forward-health receipt
        run: python scripts/build_model_health.py
      - name: Build expert quant-governance receipt
        run: python scripts/build_quant_governance.py
      - name: Build portfolio risk and champion-shadow receipt
        run: python scripts/build_portfolio_shadow.py
      - name: Governance regression tests
        run: |
          python -m unittest tests.test_quant_governance -v
          python -m unittest tests.test_portfolio_shadow -v
      - name: Enforce fail-closed calibration contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/latest.json').read_text())
          h=json.loads(Path('data/model-health.json').read_text())
          g=json.loads(Path('data/quant-governance.json').read_text())
          p=json.loads(Path('data/portfolio-shadow.json').read_text())
          resolved=int((d.get('memory') or {}).get('resolved') or 0)
          if resolved < 30 and any(x.get('forecast_probability') is not None for x in d.get('signals') or []): raise SystemExit('Fail-closed breach: probability published too early')
          if h.get('status')=='BLOCKED' or g.get('status')=='BLOCKED': raise SystemExit('Governance BLOCKED')
          if g.get('policy',{}).get('live_capital_auto_promotion') is not False: raise SystemExit('Live auto-promotion must remain disabled')
          if p.get('capital_policy','').find('PAPER/RESEARCH') < 0: raise SystemExit('Portfolio diagnostic capital policy missing')
          print('Forward, portfolio and shadow governance verified')
          PY
      - name: Sync canonical public root snapshot
        run: cp data/latest.json latest.json
      - name: Commit health, governance, portfolio and root snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "alpha-engine-bot"
          git config user.email "alpha-engine-bot@users.noreply.github.com"
          git add data/model-health.json data/quant-governance.json data/portfolio-shadow.json latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: publish Alpha health governance portfolio and shadow diagnostics"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main && git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
