name: Deploy Alpha Web App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "finance-cockpit.css"
      - "finance-cockpit.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "assets/**"
      - "data/**"
  workflow_run:
    workflows: ["Update Alpha Engine Data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Verify V9 frontend syntax
        run: node --check finance-cockpit.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build public allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data
          cp index.html finance-cockpit.css finance-cockpit.js manifest.webmanifest sw.js icon-180.png icon-192.png icon-512.png _site/
          cp data/latest.json data/backtest-v8.json _site/data/
          if [ -f data/market-series.json ]; then cp data/market-series.json _site/data/; fi
          if [ -f data/automation-health.json ]; then cp data/automation-health.json _site/data/; fi
          if find _site -type f \( -name '*.py' -o -name '*.yml' -o -name '*memory*' \) | grep -q .; then
            echo 'Private implementation file leaked into public artifact'
            exit 1
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
