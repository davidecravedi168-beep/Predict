name: Deploy Alpha Web App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html","finance-cockpit.css","freeze-ui.css","quant-governance.css","finance-cockpit.js","quant-governance.js","niche-status.js","manifest.webmanifest","sw.js","alpha-icon.svg","icon-180.png","assets/**","data/**"]
  workflow_run:
    workflows: ["Update Alpha Engine Data", "Alpha Engine — Model Health & Root Sync"]
    types: [completed]
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with: {ref: main}
      - name: Generate identical multi-size app icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          src=Image.open('icon-180.png').convert('RGBA')
          for size,name in [(180,'alpha-home-180.png'),(192,'alpha-home-192.png'),(512,'alpha-home-512.png')]: src.resize((size,size),Image.Resampling.LANCZOS).save(name)
          PY
      - name: Verify frontend and governance contracts
        run: |
          node --check finance-cockpit.js && node --check quant-governance.js && node --check niche-status.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          if Path('data/quant-governance.json').exists():
           g=json.loads(Path('data/quant-governance.json').read_text()); assert g.get('schema_version') in {'2.0','2.1','2.2'}; assert g.get('policy',{}).get('live_capital_auto_promotion') is False
          if Path('data/portfolio-shadow.json').exists():
           p=json.loads(Path('data/portfolio-shadow.json').read_text()); assert p.get('schema_version')=='1.0'; assert 'PAPER/RESEARCH' in p.get('capital_policy','')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build public allowlist
        run: |
          rm -rf _site && mkdir -p _site/data
          cp index.html finance-cockpit.css freeze-ui.css quant-governance.css finance-cockpit.js quant-governance.js niche-status.js manifest.webmanifest sw.js icon-180.png alpha-home-180.png alpha-home-192.png alpha-home-512.png _site/
          cp data/latest.json data/backtest-v8.json _site/data/
          for f in market-series automation-health model-health quant-governance portfolio-shadow; do [ ! -f data/$f.json ] || cp data/$f.json _site/data/; done
          if find _site -type f \( -name '*.py' -o -name '*.yml' -o -name '*memory*' \) | grep -q .; then exit 1; fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with: {path: "_site"}
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
