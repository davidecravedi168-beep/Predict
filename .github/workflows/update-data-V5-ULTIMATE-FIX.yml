name: Update Alpha Engine Data

on:
  workflow_dispatch:

  schedule:
    # Aggiornamento ogni 30 minuti nei giorni feriali
    # durante la fascia utile per il mercato USA
    - cron: "*/30 12-22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: alpha-engine-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update market data
        shell: bash
        run: |
          set -e

          git config user.name "alpha-engine-bot"
          git config user.email "alpha-engine-bot@users.noreply.github.com"

          for attempt in 1 2 3
          do
            echo "===================================="
            echo "Alpha Engine attempt $attempt / 3"
            echo "===================================="

            # Parti sempre dall'ultima versione presente su GitHub.
            # Niente rebase = niente conflitti su memory.json.
            git fetch origin main
            git reset --hard origin/main

            echo "Running Alpha Engine..."

            if ! python engine.py
            then
              echo "Engine error."

              if [ "$attempt" -lt 3 ]
              then
                echo "Retry in 25 seconds..."
                sleep 25
                continue
              fi

              exit 1
            fi

            echo "Validating generated data..."

            python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          latest = Path("data/latest.json")
          memory = Path("data/memory.json")

          if not latest.exists():
              raise SystemExit("ERROR: data/latest.json missing")

          if not memory.exists():
              raise SystemExit("ERROR: data/memory.json missing")

          data = json.loads(latest.read_text(encoding="utf-8"))

          required = [
              "updated_at",
              "market",
              "signals",
              "watchlist"
          ]

          for key in required:
              if key not in data:
                  raise SystemExit(f"ERROR: {key} missing")

          ts = datetime.fromisoformat(
              data["updated_at"].replace("Z", "+00:00")
          )

          age = (
              datetime.now(timezone.utc) - ts
          ).total_seconds()

          if age > 600:
              raise SystemExit(
                  f"ERROR: latest.json too old: {age:.0f} seconds"
              )

          if not isinstance(data["signals"], list):
              raise SystemExit("ERROR: signals is not a list")

          if not isinstance(data["watchlist"], list):
              raise SystemExit("ERROR: watchlist is not a list")

          print("")
          print("ALPHA ENGINE HEALTH CHECK: PASS")
          print("updated_at:", data["updated_at"])
          print("signals:", len(data["signals"]))
          print("watchlist:", len(data["watchlist"]))
          PY

            echo "Preparing GitHub update..."

            git add data/latest.json data/memory.json

            if git diff --cached --quiet
            then
              echo "No changes detected."
              exit 0
            fi

            git commit -m "bot: refresh Alpha Engine data"

            echo "Pushing fresh market data..."

            if git push origin HEAD:main
            then
              echo "===================================="
              echo "ALPHA ENGINE UPDATE SUCCESS"
              echo "===================================="
              exit 0
            fi

            echo "Repository changed during the update."

            if [ "$attempt" -lt 3 ]
            then
              echo "Restarting from latest main in 10 seconds..."
              sleep 10
            fi
          done

          echo "ERROR: unable to update after 3 attempts."
          exit 1
    
