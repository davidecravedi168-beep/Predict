name: Alpha Engine V8.6 Cost-Aware Walk-Forward Backtest

on:
  workflow_dispatch:
  schedule:
    # Weekly independent research audit; off-peak UTC reduces scheduler contention.
    - cron: "17 4 * * 0"
  push:
    branches: [main]
    paths:
      - 'engine.py'
      - '.github/workflows/backtest-alpha-engine-v8.yml'

permissions:
  contents: write

concurrency:
  group: alpha-engine-v86-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Engine governance self-test
        run: python engine.py --self-test

      - name: Walk-forward V8.6
        run: python engine.py --backtest

      - name: Validate V8.6 research artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/backtest-v8.json')
          if not p.exists(): raise SystemExit('backtest-v8.json missing')
          d=json.loads(p.read_text())
          version=str(d.get('model_version',''))
          if not version.startswith('8.6.'):
              raise SystemExit(f'backtest/model mismatch: expected 8.6.x, got {version or "missing"}')
          if d.get('lookahead') is not False:
              raise SystemExit('lookahead guard failed')
          if d.get('optimization_on_test') is not False:
              raise SystemExit('test optimization guard failed')
          if d.get('method') != 'WALK_FORWARD_PREQUENTIAL_ADAPTIVE_HORIZON':
              raise SystemExit('backtest method mismatch')
          if d.get('transaction_costs_included') is not True:
              raise SystemExit('cost-aware backtest gate missing')
          summary=d.get('summary') or {}
          if not summary.get('signals'):
              raise SystemExit('no backtest signals')
          if int(summary.get('signals') or 0) < 30:
              raise SystemExit('backtest sample too small for release audit')
          print('V8.6 cost-aware walk-forward OK:', summary)
          PY

      - name: Save V8.6 backtest artifact
        run: |
          set -euo pipefail
          git config user.name "alpha-engine-bot"
          git config user.email "alpha-engine-bot@users.noreply.github.com"
          cp data/backtest-v8.json /tmp/backtest-v8.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/backtest-v8.json data/backtest-v8.json
            git add data/backtest-v8.json
            if git diff --cached --quiet; then
              echo "No backtest changes."
              exit 0
            fi
            git commit -m "bot: V8.6 cost-aware walk-forward backtest"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
