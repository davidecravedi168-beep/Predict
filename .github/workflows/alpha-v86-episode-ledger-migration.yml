name: Alpha v8.6 Episode Ledger Migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_alpha_v86_upgrade_v2.py'
      - 'scripts/test_alpha_v86_guards.py'
      - '.github/workflows/alpha-v86-episode-ledger-migration.yml'

permissions:
  contents: write

concurrency:
  group: alpha-v86-migration
  cancel-in-progress: false

jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply fail-closed migration
        run: python scripts/apply_alpha_v86_upgrade_v2.py

      - name: Syntax checks
        run: python -m py_compile engine.py scripts/apply_alpha_v86_upgrade_v2.py scripts/test_alpha_v86_guards.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Episode-ledger tests
        run: python scripts/test_alpha_v86_guards.py

      - name: Engine self-test
        run: python engine.py --self-test

      - name: Patch hygiene
        run: |
          git diff --check
          git diff --stat

      - name: Commit verified v8.6 source
        run: |
          if git diff --quiet -- engine.py index.html; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine.py index.html
          git commit -m 'Upgrade Alpha Engine to v8.6 episode ledger'
          git push
