name: Alpha Engine — Refresh & Publish

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/alpha-engine-refresh-publish.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: alpha-engine-refresh-publish
  cancel-in-progress: true

jobs:
  refresh-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Refresh Alpha v8.6 data + charts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          before="$(gh run list --repo "$repo" --workflow update-data.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run update-data.yml --repo "$repo" --ref main

          run_id=""
          for _ in $(seq 1 40); do
            sleep 5
            candidate="$(gh run list --repo "$repo" --workflow update-data.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$candidate" != "0" ] && [ "$candidate" != "$before" ]; then
              run_id="$candidate"
              break
            fi
          done

          test -n "$run_id" || { echo 'Alpha v8.6 updater did not start'; exit 1; }
          gh run watch "$run_id" --repo "$repo" --exit-status

      - name: Verify Alpha v8.6 episode-ledger snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/data/latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d > /tmp/latest.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          d=json.load(open('/tmp/latest.json', encoding='utf-8'))
          assert d.get('schema_version') == '8.6', d.get('schema_version')
          assert str(d.get('model_version','')).startswith('8.6.'), d.get('model_version')
          edge=d.get('edge_core') or {}
          assert edge.get('domain_profile') == 'FINANCE'
          assert edge.get('signal_lock') == 'ONE_ACTIVE_EPISODE_PER_TICKER_WITH_STABLE_SETUP_KEY'
          learning=d.get('model_learning') or {}
          assert learning.get('learning_lineage') == 'ALPHA_V86_EPISODE_LEDGER_1'
          mem=d.get('memory') or {}
          for key in ('independent_episodes','active','superseded_or_excluded','legacy_resolved_excluded','resolved','learning_resolved'):
              assert key in mem, key
          rows=[*(d.get('signals') or []),*(d.get('watchlist') or [])]
          assert rows
          assert all('model_completeness_score' in x for x in rows)
          raw=d.get('engine_updated_at') or d.get('updated_at')
          ts=datetime.fromisoformat(raw.replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-ts).total_seconds()/60
          if age > 30:
              raise SystemExit(f'Alpha snapshot stale after refresh: {age:.1f}m')
          print(f"Alpha v8.6 verified: {age:.1f}m old · active={mem.get('active')} · clean resolved={mem.get('resolved')}")
          PY

      - name: Verify V9 observed chart feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/data/market-series.json?ref=main" --jq .content | tr -d '\n' | base64 -d > /tmp/market-series.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/market-series.json', encoding='utf-8'))
          if d.get('strict_no_fabrication') is not True:
              raise SystemExit('market-series strict_no_fabrication missing')
          if d.get('status') not in ('OK','DEGRADED'):
              raise SystemExit(f"market-series unavailable: {d.get('status')}")
          symbols=d.get('symbols') or {}
          if len(symbols) < 4:
              raise SystemExit(f'insufficient chart symbols: {len(symbols)}')
          observed=sum(1 for x in symbols.values() if len(x.get('daily') or []) >= 20 or len(x.get('intraday') or []) >= 8)
          if observed < 4:
              raise SystemExit(f'insufficient observed chart histories: {observed}')
          print(f'V9 chart feed verified: {observed}/{len(symbols)} usable symbols')
          PY

      - name: Verify published source contracts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in engine.py index.html finance-cockpit.js; do
            gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=main" --jq .content | tr -d '\n' | base64 -d > "/tmp/${file//\//_}"
          done
          grep -q '8.6.0-episode-ledger-cost-aware' /tmp/engine.py
          grep -q 'ONE_ACTIVE_EPISODE_PER_TICKER_WITH_STABLE_SETUP_KEY' /tmp/engine.py
          grep -q 'Decision ledger' /tmp/index.html
          grep -q 'compactLedgerEpisodes' /tmp/finance-cockpit.js
          grep -q 'z.observed_at===obsAt' /tmp/finance-cockpit.js
          node --check /tmp/finance-cockpit.js
          echo 'Published v8.6 source contracts verified.'

      - name: Publish Alpha to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          before="$(gh run list --repo "$repo" --workflow deploy-pages-V6.1-AUTO.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run deploy-pages-V6.1-AUTO.yml --repo "$repo" --ref main

          run_id=""
          for _ in $(seq 1 40); do
            sleep 5
            candidate="$(gh run list --repo "$repo" --workflow deploy-pages-V6.1-AUTO.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$candidate" != "0" ] && [ "$candidate" != "$before" ]; then
              run_id="$candidate"
              break
            fi
          done

          test -n "$run_id" || { echo 'Alpha Pages deploy did not start'; exit 1; }
          gh run watch "$run_id" --repo "$repo" --exit-status
          echo 'Alpha v8.6 episode ledger + V9 + observed charts + validation + publication complete.'

# V8.6 episode-ledger full-cycle trigger marker
