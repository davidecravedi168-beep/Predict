name: Alpha Engine Refresh Pulse

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/alpha-refresh-pulse.yml'
  schedule:
    # Off-minute cadence avoids the busiest :00/:30 scheduler slots.
    - cron: '17,47 * * * 1-5'
    # Futures reopen Sunday evening UTC.
    - cron: '17,47 22-23 * * 0'

permissions:
  actions: write
  contents: read

concurrency:
  group: alpha-refresh-pulse
  cancel-in-progress: true

jobs:
  recover-if-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Check freshness and run updater when needed
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          stale="$(python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          d = json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          raw = d.get('engine_updated_at') or d.get('updated_at')
          if not raw:
              print('1')
              raise SystemExit
          ts = datetime.fromisoformat(raw.replace('Z', '+00:00'))
          age = (datetime.now(timezone.utc) - ts).total_seconds() / 60
          print('1' if age > 25 else '0')
          PY
          )"

          if [ "$stale" = "0" ]; then
            echo "Alpha snapshot is fresh; no recovery needed."
            echo "recovered=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="$(gh run list --workflow update-data.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          echo "Snapshot stale; dispatching update-data.yml (previous run: $before)."
          gh workflow run update-data.yml --ref main

          run_id=""
          for _ in $(seq 1 24); do
            sleep 5
            candidate="$(gh run list --workflow update-data.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$candidate" != "0" ] && [ "$candidate" != "$before" ]; then
              run_id="$candidate"
              break
            fi
          done

          if [ -z "$run_id" ]; then
            echo "Updater dispatch did not create a visible run within 120 seconds."
            exit 1
          fi

          echo "Watching updater run $run_id until completion."
          gh run watch "$run_id" --exit-status
          echo "recovered=1" >> "$GITHUB_OUTPUT"

      - name: Verify V8.5 snapshot contract and freshness
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:data/latest.json > /tmp/latest.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          d = json.load(open('/tmp/latest.json', encoding='utf-8'))
          if d.get('schema_version') != '8.5':
              raise SystemExit(f"Expected schema 8.5, got {d.get('schema_version')}")
          if not str(d.get('model_version', '')).startswith('8.5.'):
              raise SystemExit(f"Expected V8.5 model, got {d.get('model_version')}")
          if (d.get('edge_core') or {}).get('domain_profile') != 'FINANCE':
              raise SystemExit('Finance Edge Core profile missing')
          raw = d.get('engine_updated_at') or d.get('updated_at')
          ts = datetime.fromisoformat(raw.replace('Z', '+00:00'))
          age = (datetime.now(timezone.utc) - ts).total_seconds() / 60
          if age > 30:
              raise SystemExit(f'V8.5 snapshot is stale after pulse: {age:.1f}m')
          print(f'Alpha V8.5 freshness verified: {age:.1f}m old')
          PY

      - name: Publish latest snapshot to GitHub Pages
        if: ${{ github.event_name == 'push' || steps.recovery.outputs.recovered == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh run list --workflow deploy-pages-V6.1-AUTO.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          echo "Dispatching Pages deploy (previous run: $before)."
          gh workflow run deploy-pages-V6.1-AUTO.yml --ref main

          deploy_id=""
          for _ in $(seq 1 24); do
            sleep 5
            candidate="$(gh run list --workflow deploy-pages-V6.1-AUTO.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$candidate" != "0" ] && [ "$candidate" != "$before" ]; then
              deploy_id="$candidate"
              break
            fi
          done

          if [ -z "$deploy_id" ]; then
            echo "Pages deploy did not create a visible run within 120 seconds."
            exit 1
          fi

          echo "Watching Pages deploy $deploy_id until completion."
          gh run watch "$deploy_id" --exit-status
          echo "Alpha refresh -> validation -> publication chain completed."
